# Same as .github/workflows/ci.yml, on the default `docker` runner image (node:22-bookworm,
# runs as root) — checkout is a JS action.
name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq shellcheck systemd >/dev/null
      - run: tests/lint.sh
  test:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq ffmpeg jq curl python3 eject udev >/dev/null
      - run: tests/smoke.sh
  secrets:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (whole history)
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.*)$
          GITLEAKS_VERSION: 8.21.2
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball" -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks
          ./gitleaks git --redact --no-banner .
