# Release (run by hand: Actions → release → Run workflow). Tags the commit as v<VERSION from
# coaster.sh> — annotated, tagger "Karubits <karubits@proton.me>" — pushes the tag with the
# Actions token and publishes the release with that version's CHANGELOG section as notes, so
# the Forgejo release and tag belong to the Actions bot, not to a personal account. Don't push
# release tags by hand. tools/release-notes.sh refuses a version without a CHANGELOG section.
# The GitHub mirror receives the tag and runs .github/workflows/release.yml.
name: release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit to release (default: the tip of the branch you run this on)"
        required: false
jobs:
  release:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4   # current tools/
      - uses: actions/checkout@v4   # the commit to release (older ones may predate tools/)
        with:
          ref: ${{ inputs.commit || forgejo.sha }}
          path: tagged
          fetch-depth: 0
      - name: Tag and release
        env:
          TOKEN: ${{ forgejo.token }}
          API: ${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}/releases
        run: |
          apt-get update -qq && apt-get install -y -qq jq >/dev/null
          version="$(sed -n 's/^VERSION=//p' tagged/coaster.sh)"
          tag="v$version"
          notes="$(tools/release-notes.sh "$tag" tagged)"
          cd tagged
          commit="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git fetch -q origin "refs/tags/$tag:refs/tags/$tag"
            [ "$(git rev-parse "$tag^{commit}")" = "$commit" ] \
              || { echo "$tag already exists on another commit — bump VERSION" >&2; exit 1; }
            echo "tag $tag exists on $commit"
          else
            git -c user.name=Karubits -c user.email=karubits@proton.me tag -a "$tag" -m "$tag" "$commit"
            git push -q origin "refs/tags/$tag"
            echo "tagged $commit as $tag"
          fi
          if curl -fsS -o /dev/null -H "Authorization: token $TOKEN" "$API/tags/$tag"; then
            echo "release $tag already exists"
          else
            jq -n --arg t "$tag" --arg b "$notes" '{tag_name: $t, name: $t, body: $b}' \
              | curl -fsS -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
                  --data-binary @- "$API" | jq -r '"\(.html_url) (by \(.author.login))"'
          fi
