# Renovate on Forgejo (the source of truth; the GitHub copy is a mirror): weekly PRs for the
# pinned CI actions, the gitleaks version and this Renovate image. Config: renovate.json.
# Repo secrets (Settings → Actions → Secrets); the job skips without RENOVATE_TOKEN:
#   RENOVATE_TOKEN             Forgejo token with repository + issue read/write (ideally a bot user)
#   RENOVATE_GITHUB_COM_TOKEN  GitHub token, no scopes needed (fine-grained, public repos read-only):
#                              Renovate needs it to look up GitHub Actions and GitHub releases
name: renovate
on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17
  workflow_dispatch:
jobs:
  renovate:
    runs-on: docker
    container:
      image: ghcr.io/renovatebot/renovate:44.126.0
    steps:
      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: ${{ forgejo.server_url }}/api/v1
          RENOVATE_REPOSITORIES: ${{ forgejo.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "RENOVATE_TOKEN secret not set — skipping (see the comment at the top of this file)"
            exit 0
          fi
          renovate
