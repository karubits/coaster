# Tag vX.Y.Z pushed → GitHub release with that version's CHANGELOG section as notes.
# tools/release-notes.sh refuses a tag that doesn't match VERSION in coaster.sh / CHANGELOG.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tools/release-notes.sh "$TAG" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          fi
